name: protected-files

# pull_request_target runs this workflow from the base branch, so a pull
# request cannot weaken the guard by editing it. The pull request head is only
# fetched as git data and is never checked out or executed.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  protected-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard the protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || {
            echo "::error::pull request head ${HEAD_SHA} is not reachable from refs/pull/${PR_NUMBER}/head"
            exit 1
          }
          scripts/guard-protected.sh "$BASE_SHA" "$HEAD_SHA"
