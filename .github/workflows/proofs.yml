name: proofs

on:
  pull_request:

permissions:
  contents: read

# Pinned tool versions. Bumping a version, or the Bend checksum, is a deliberate
# change and belongs in its own pull request: a new toolchain can change what the
# proofs accept.
env:
  BEND_VERSION: "2.0.40"
  BEND_SHA256: "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b"
  ELAN_VERSION: "4.4.0"
  ELAN_TOOLCHAIN: "leanprover/lean4:v4.34.0"
  BEND_NO_TELEMETRY: "1"

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PROOF.bend
        id: proof
        run: |
          if [ -f PROOF.bend ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROOF.bend is not in this tree yet; skipping the proof checks."
          fi

      # Restored before the installs below, otherwise the Lean toolchain is
      # downloaded again on every run.
      - name: Cache Lean toolchain and Bend verdict kernel
        if: steps.proof.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.bend/bendtt
          key: proofs-${{ runner.os }}-bend-${{ env.BEND_VERSION }}-lean-${{ env.ELAN_TOOLCHAIN }}

      - name: Install Bend ${{ env.BEND_VERSION }}
        if: steps.proof.outputs.present == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bend-${BEND_VERSION}-linux-x64.tar.gz"
          url="https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$archive"
          echo "${BEND_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bend-extract" "$HOME/.bend/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bend-extract"
          install -m 0755 "$RUNNER_TEMP/bend-extract/bend/bin/bend" "$HOME/.bend/bin/bend"
          rm -rf "$HOME/.bend/bend2" "$HOME/.bend/guide"
          mv "$RUNNER_TEMP/bend-extract/bend/bend2" "$HOME/.bend/bend2"
          mv "$RUNNER_TEMP/bend-extract/bend/guide" "$HOME/.bend/guide"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: Install elan
        if: steps.proof.outputs.present == 'true'
        run: |
          set -euo pipefail
          # elan's documented installer URL is not version-pinned (the script
          # fetches the latest release), so install the pinned elan-init release
          # binary instead of piping a script to a shell.
          url="https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$RUNNER_TEMP/elan.tar.gz"
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$ELAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check proofs
        if: steps.proof.outputs.present == 'true'
        run: scripts/check-proofs.sh
